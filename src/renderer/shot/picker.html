<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Picture of a window – Desktop Buddy</title>
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="shot.css">
</head>
<body class="picker">
<!-- Open windows (not the app's own): click = screenshot at the window's real size. -->
<div class="p-head"><h1>Pick a window</h1><button id="refresh" type="button">Refresh</button><button id="cancel" type="button">Cancel</button></div>
<p class="p-hint">Click the window you want in the picture. It can be behind others, but not minimized. Esc = cancel.</p>
<div class="p-grid" id="grid" role="list"></div>
<script src="picker.js"></script>
</body>
</html>
